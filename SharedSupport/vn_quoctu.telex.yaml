  - xform/đ/dd/ #đ

  - derive/([ae])([sfrxj])([ou])/$1$3$2/               #Không có dòng này, muốn gõ "áo" thì phải gõ mặc định theo dạng a-s-o
  - derive/(u|uw|ư|i|uy)([sfrxj])(a)/$1$3$2/                #Tương tự
  - derive/(u)([sfrxj])(o)/$1$3$2/                #Tương tự
  - derive/(aw|aa|ow|uw|w|ee)([sfrxj])(ng|nh|ch)/$1$3$2/       #Cuối tổ hợp nào có phụ âm ghép luôn được viết trước
  - derive/(aw|aa|ow|uw|w|ee|uwow|uow)([sfrxj])([iunptckmy])/$1$3$2/    #Cuối tổ hợp nào có phụ âm đơn thì phải viết sau
  - derive/([aeiouâăôơê])([sfrxj])(ng|nh|ch)/$1$3$2/    #Tương tự
  - derive/([aeiouâăôơê])([sfrxj])([iunptckmy])/$1$3$2/ #Tương tự
  - derive/(u)([sfrxj])([iy])/$1$3$2/
  - derive/(uy)([sfrxj])(nh|t)/$1$3$2/                 #Tương tự
  - derive/(qu)([sfrxj])(i|a)/$1$3$2/                         #Không có dòng này khi gõ quis sẽ thành qúi
  - derive/uwow/uow/
  - derive/(uwow)([sfrxj])/uow$2/
