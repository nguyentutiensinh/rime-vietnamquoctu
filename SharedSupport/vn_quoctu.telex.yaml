algebra:  # aăâiuưeêoôơy
  #※  Quy tắc hoạt động chính tả, chuyển đổi một bộ và gõ mã hóa thành âm tiết phiên âm
  - xform/(🀃|🀁|🀀|🀂|🀆|【|⚀|⚁|⚂|⚃|⚄|⚅).+$//
