#※  Rime schema
#※  encoding: utf-8
#

schema:
  schema_id: vn_quoctu
  name: "🇻🇳 越喃國字"
  version: "25.03.14"
  author:
    - 源慈先生  < @nguyentutiensinh|https://nguyentutiensinh.tumblr.com >
  description: |
    Việt Nam Quốc Tự 《越喃國字🇻🇳》 Bộ gõ Hán Nôm Telex - Quy Phủ Thư Quán
    Chỉnh sửa bộ biên dịch dựa trên phần mềm mã nguồn mở RIME Method Keyboard
    Dịch chữ quốc ngữ sang chữ nôm, sữ dụng thay thế bàn phím pinyin
      * chenhe: https://chenhe.me
      * rime wiki: https://github.com/rime/home/wiki
      * rime ice: https://github.com/iDvel/rime-ice
      * Từ điển Hán Nôm: https://hvdic.thivien.net/
      * opencc - Mở chuyển đổi tiếng Trung
#※  show_notifications_when: always  #※  options: always | never | appropriate

menu:                 #todo: Menu option
  page_size: 10            #※  row in 1 page 'menu'

switcher:             #todo: Name switcher
  caption: 􀍟 越喃國字🇻🇳

switches:             #todo: Menu chuyển đổi nhập liệu ※  Shortcut " ⌃ + ` "
  - name: ascii_mode              #? Switch: input
    reset: 0                      #※  Set default
    states: [􀳧,􀅶]              #※  Shortcut "⌃ + 1",
  - name: transcription           #? Switch: Phồn Thể sang giản thể
    states: [􀧥,􀧣]               #※  Shortcut "⌃ + 2"
    reset: 0                      #※  Set default
  - name: ascii_punct             #? Switch: Symbol.
    states: [􀤘,􀃪]               #※  Shortcut "⌃ + 3"
    reset: 0                      #※  Set default
  - name: full_shape              #? Switch: Mono space, Fixed Width
    states: [􀚓,􀾘]               #※  Shortcut "⌃ + 4"
    reset: 0                      #※  Set default
  - name: emoji_suggestion        #? Switch: Gợi ý emoji.
    states: [􀥧,􀎸]               #※  Shortcut "⌃ + 5"
    reset: 1                      #※  Set default
  - name: opencc_suggestion        #? Switch: Gợi ý openCC.
    states: [􀶑,􀶒]               #※  Shortcut "⌃ + 6"
    reset: 1                      #※  Set default

engine:               #todo: Khai báo công cụ đầu vào
  processors:          #todo: 1. Xử lý đầu vào
    - lua_processor@*select_character
    # - lua_processor@*codeLengthLimit_processor     # sử dụng (Lua) Giới hạn tốc độ, nội dung đầu vào (Ngăn chặn độ trễ do độ dài quá mức)
    - ascii_composer        #※  [switches]: ascii_mode
    - recognizer            #※  Regex input -> matcher: Xử lý mã đầu vào đáp ứng các quy tắc cụ thể, chẳng hạn như URL, tìm kiếm ngược, v.v.
    - key_binder            #※  Shortcut: Liên kết các phím với các phím khác trong các điều kiện cụ thể, chẳng hạn như xác định lại dấu phẩy và dấu chấm làm phím lật trang ứng viên
    - speller               #※  input: type keyboard (no space)  -> return 'string'
    - punctuator            #※  input: speller -> return: 'punct_segmentor' (Check)
    - selector              #※  [1..9] menu select by number; [fn+(↓|↑) / 'Page_Up','Page_Down'],  next, prev page 'menu'
    - navigator             #※  [← →] move 'speller'
    - express_editor        #※  input: speller -> return: 'abc_segmentor' (Check)
    #※  - fluid_editor        #※  input: speller -> return: 'fallback_segmentor' (Check)
  segmentors:         #todo: 2. Kiểm tra
    - ascii_segmentor             #※  Để đánh dấu một đoạn văn phương Tây (ví dụ: ở chế độ phương Tây), các chữ cái được in trực tiếp

    - matcher                     #※  Regex: Xác định các đoạn văn đáp ứng các quy tắc cụ thể, chẳng hạn như URL, tìm kiếm ngược, v.v.
    - abc_segmentor               #※  input: 'editor' (check: abc) -> return 'table_translator'
    - punct_segmentor             #※  input: 'punctuator' (check: perfix, suffix) -> return 'punct_translator'
    - fallback_segmentor          #※  input: 'editor' (check: string Unknown) -> return 'echo_translator'
  translators:        #todo: 3. Dịch
    - lua_translator@*mint_date_time_translator          # time、date、Week、month
    - lua_translator@*number_translator                  # Amount of amount
    - lua_translator@*chineseLunarCalendar_translator    # lunar calendar
    - lua_translator@*force_gc

    - punct_translator                  #※  input: 'punct_segmentor' (find: punctuator_dict -> return: symbol in punctuation_table)-> (menu)
    - echo_translator                   #※  input: 'fallback_segmentor' (if: not in dict -> return: full_string) -> ( menu)
    - script_translator                 #※  Trình dịch tập lệnh cho các giải pháp nhập liệu dựa trên bảng âm tiết như Bính âm và Bính âm Quảng Đông #※  - Mục này có thể tải nhiều phiên bản, theo sau là @+tên người dịch [chẳng hạn như: bính âm, jyutping, v.v.]
    - reverse_lookup_translator         #※  Trình tra cứu ngược, sử dụng lược đồ mã hóa khác để kiểm tra các bộ lọc mã:
    - echo_translator                   #※  input: 'fallback_segmentor' (if: not in dict -> return: full_string) -> ( menu)
    #※  - table_translator                #※  input: 'abc_segmentor' (find: dict -> return: string in dict)-> (menu)
  filters:            #todo 4. Lọc kết quả dịch
    - lua_filter@*corrector_filter               # Lời nhắc lỗi chính tả
    - lua_filter@*autocap_filter                 # Tiếng Anh Auto Caps
    - simplifier@opencc_suggestion               #※ Emoji
    - simplifier@emoji_suggestion               #※ Emoji
    - simplifier@transcription_cc              #※  Chuyển đổi Phồn thể / Giản Thể
    # - uniquifier                                #※  Lọc các từ ứng cử trùng lặp, có thể đến từ simplifier

speller:              #todo: dict.[value] -> "string", string càng chi tiết, càng dễ nhận diện từ, (sửa lỗi tìm kiếm chính tả, đặt dấu, thứ tự nhập)
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ      #※  Bảng chữ cái, bao gồm các phím được sử dụng và nhấn. Tuy có trước sau, nhưng khi hình thành và nhấn, tất cả đều được sắp xếp theo thứ tự bảng chữ cái.
  delimiter: " " #Dấu phân cách có thể là kí tự khoảng trống hoặc '
  algebra:
    __include: vn_quoctu.telex:/algebra
translator:           #todo: Dịch đầu vào, đầu ra
  dictionary: vn_quoctu               #※ name dict (hello.dict.yaml)
  spelling_hints: 10              #※ corrector.lua : nhắc nhở sai âm Lua tương thích 双拼 shuangpin， pinyin hiển thị ở comment  / Đặt số lượng từ trong vòng bao nhiêu từ để hoàn thành chỉnh âm (chỉ script_translator hoạt động)
  #? enable_correction: true      # Rime auto correction，tương thích điện thoại 26 phím link: https://github.com/rime/librime/pull/228
  # enable_encoder: true            #※ Cho phép tạo từ tự động
  # enable_sentence: true           #※ Bật tính năng nhập câu tự động
  enable_user_dict: true          #※ Kích hoạt từ điển người dùng
  enable_completion: true
  encode_commit_history: true     #※ Tự động mã hóa các từ đã có trên màn hình để cải thiện tỷ lệ trúng của lần nhập tiếp theo
  always_show_comments: true      #※ corrector.lua  Luôn hiện comment paging [chỉ script_translator hoạt động]
  # initial_quality: 1.2

  preedit_format:   #todo: input -> 'string' (search: [speller]) if (string.input = dict.[value]) => show comment
    __include: vn_quoctu.telex:/preedit_format
  comment_format:   #todo: 'speller'ouput -> 'text' -> show on 'paging'
    __include: vn_quoctu.telex:/comment_format #corrector.lua


corrector_filter:     #todo: Nhắc lỗi chính tả
  keep_source_comment: false      #※ Khi văn bản không mắc lỗi chính tả hoặc phát âm sai, hãy giữ nguyên note gốc

chineseLunarCalendar_translator: lunar #todo: Lịch Âm

#*: Lua config：vì corrector định dạng comment，Biểu tượng giải quyết là {comment}
#* mặc định "{comment}" nhập "hun dun" => 「馄饨」bên cạnh xuất hiện hún tun là comment
#* ví dụ, thêm " vào comment => "({comment})" biến thành (hún tun)
corrector: "{comment}"


transcription_cc:     #todo: Phồn -> Giản
  option_name: transcription                    #※ Tương ứng 'switches' Các tên mục chuyển đổi được đặt trong,Với 'key_binder/binding' tên được sử dụng trong
  opencc_config:  t2s.json                      #※ rime_dir/opencc/ => # s2t.json | s2hk.json | s2tw.json | s2twp.json
  tips: all                                     #※ all: Hiển thị tất cả | char: Chỉ hiển thị các ký tự đơn | none: Không hiển thị
  always_show_comments: true                    #※ corrector.lua  Luôn hiện comment paging [chỉ script_translator hoạt động]
  # excluded_types: [ reverse_lookup ]          #※ Không chuyển phiên dịch （2 chiều pinyin）
  comment_format:
    __include: vn_quoctu.telex:/comment_format

emoji_suggestion:     #todo: Gợi ý Emoji
  opencc_config: emoji.json
  option_name: emoji_suggestion
  tips: all
  inherit_comment: false

opencc_suggestion:     #todo: Gợi ý OpenCC
  opencc_config: opencc.json
  option_name: opencc_suggestion
  tips: all
  inherit_comment: false

recognizer:           #todo: Regex input
  patterns:
    url: "^[a-z]+[.].+$"
    punct: "^/([0-9]0?|[a-zA-Z]+)$"
    # reverse_lookup: "`[0-9A-Za-z]*'?$"
    rmb: "^N[0-9]+[.]?[0-9]*"        # 响应 lua_translator@number_translator The script will automatically obtain the first 2 个字符作为触发前缀
    gregorian_to_lunar: "^AL[0-9]{1,8}"  # 响应 lua_translator@Chinese_lunar_calendar 公历转农历，输入 N20240115 得到「二〇二四年腊月初五」，脚本将自动获取第 2 个字符作为触发前缀



key_binder:           #todo: Shortcut
  bindings:
    __patch:
      - vn_quoctu.bindings:/emacs_editing
      - vn_quoctu.bindings:/move_by_word_with_tab
      - vn_quoctu.bindings:/paging_with_comma_period
      - vn_quoctu.bindings:/numbered_mode_switch

# ascii_composer:     #todo: Shortcut: ascii_composer
#   good_old_caps_lock: true
#   switch_key:
#     Shift_L: noop
#     Shift_R: noop
#     Control_L: noop
#     Control_R: noop
#     Caps_Lock: clear
#     Eisu_toggle: clear


punctuator:           #todo: Symbols
  import_preset: vn_quoctu.symbols #※  symbols /default / punctuation.yaml

