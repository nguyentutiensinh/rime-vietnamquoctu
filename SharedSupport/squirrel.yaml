# Squirrel settings
# encoding: utf-8

config_version: '1.0'

# options: last | default | _custom_
# last: the last used latin keyboard layout
# default: US (ABC) keyboard layout
# _custom_: keyboard layout of your choice, e.g. 'com.apple.keylayout.USExtended' or simply 'USExtended'
keyboard_layout: last

# for veteran chord-typist
chord_duration: 0.1  # seconds

# options: always | never | appropriate
show_notifications_when: appropriate

style:                #todo: Tuỳ Biến Giao Diện [Font][preedit][candidate mode, cirection,event][Display]
  #※ [Font]
  font_face: 'SVN-Oriental Kaishu, SF Pro Rounded, SF Pro, Helvetica, CN-Khai, Chu-Nom-Khai, Han-Nom Kai, CN-Khai 3.0, Han-Nom Ming, FZXingKai-S04T, FZKai_U_P_P,Kaiti TC,STKaiti ,Kaiti SC, Minh Nguyen Medium'
  font_point: 20
  label_font_face: 'SVN-Oriental Kaishu, SF Pro Rounded, SF Pro, Helvetica, Roboto, Aria, Lato, sans-script'
  label_font_point: 14
  comment_font_face: 'SVN-Oriental Kaishu, SF Pro Rounded, SF Pro, Helvetica, Roboto, Aria, Lato, CN-Khai, Chu-Nom-Khai, Han-Nom Kai, CN-Khai 3.0, Han-Nom Ming, FZXingKai-S04T, FZKai_U_P_P,Kaiti TC,STKaiti ,Kaiti SC, Minh Nguyen Medium'
  comment_font_point: 18
  #※ [preedit]
  inline_preedit: false                    #※ true:　input text direct in line  / false: input text show on field
  preedit_type: composition                #※ Nội dung của khu vực chỉnh sửa trước：composition（mã biên）； preview（selected candidate）；preview_all（All candidates）
  #※ [candidate mode]
  inline_candidate: false                  #※ true: ouput translate show in line / false: ouput select in paging
  fullscreen: false                        #※ Candidate window displays full screen：true；false
  candidate_list_layout: stacked           #※ stacked | linear, ứng viên chồng lên nhau (từ trên xuống), ứng viên bên canh nhau(từ phải sang trái)
  display_tray_icon: true                  #※ Khay hiển thị thêm các biểu tượng độc lập với thanh ngôn ngữ：true；false
  # #※ [candidate Direction] horizontal
  text_orientation: horizontal             #※ Hướng dòng văn bản，và hiệu quả `vertical_text` tương đồng：horizontal；vertical
  #※ [candidate Direction] vertical
  # horizontal: true                        #※ Các ứng viên được sắp xếp theo chiều ngang（tạicustom内和andidate_list_layout的linear效果一样）
  # vertical: true                           #※ Các ứng viên được sắp xếp theo chiều dọc（tạicustom内和andidate_list_layout的linear效果一样）
  # text_orientation: vertical             #※ Hướng dòng văn bản，và hiệu quả `vertical_text` tương đồng：horizontal；vertical
  # vertical_text: true                     #※ văn bản dọc：true；false
  #※ [candidate event]
  # ascii_tip_follow_cursor: false           #※ Khi chuyển sang chế độ ASCII, dấu nhắc sẽ theo sau con chuột thay vì nhập con trỏ
  enhanced_position: true                  #※ Khi không thể định vị được ô ứng viên, hộp ứng viên sẽ hiển thị ở góc trên bên trái của cửa sổ.：true；false
  candidate_abbreviate_length: 30          #※ Các ứng cử viên được viết tắt và dấu chấm lửng sẽ được sử dụng thay thế nếu con số này vượt quá con số này. Đặt thành 0 để tắt tính năng này
  mouse_hover_ms: 0                        #※ Thời gian phản hồi lựa chọn từ khi di chuột (ms), đặt thành 0 để tắt chức năng này
  paging_on_scroll: true                   #※ Hành vi trượt bánh xe qua cửa sổ ứng viên：true（Lật trang）；false （Chọn ứng viên tiếp theo）
  click_to_capture: false                  #※ Nhấp chuột vào ứng viên để tạo ảnh chụp màn hình: true: false
  #※ [Display]
  candidate_format: '  [label]. [candidate] [comment] '  #※  %@ is automatically expanded to "[candidate] [comment]" and %c is replaced by "[label]" or "%c\u2005\u2005\u2005%@\u2005"
  # antialias_mode: default                  #※ Cài đặt khử răng cưa Subpixel：default；force_dword；cleartype；grayscale；aliased
  mutual_exclusive: true                   #※ màu trong suốt xếp chồng lên nhau
  translucency: true                       #※ sử dụng nền mờ. Chỉ hiển thị khi màu nền trong suốt

#todo: Tuỳ Biến Giao Diện
  color_scheme: bachthu
  color_scheme_dark: hongthu        #※ Darkmode


