    corner_radius: 1                        #※ Frame Corner
    hilited_corner_radius: 1                #※ Paging > Select Corner
    border_height: 4                        #※ Frame margin Y
    border_width: 4                         #※ border size
    spacing: 10                             #※ Preedit vs Paging   (inline_preedit False)
    line_spacing: 8                         #※ Khoảng cách giữa các ứng viên （candidate_list_layout: stacke）
    shadow_size: 0                          #※ Một số lớn hơn 0 sẽ hiển thị bóng xung quanh ứng viên được chiếu sáng nhiều
    #※ Global
    border_color: 0x87DFFA #fadf87                   #※ Frame border (All)
    #※ Preedit
    text_color: 0x87DFFA #fadf87                     #※ Preedit text (no highlight) cursor
    hilited_text_color: 0x87DFFA #fadf87             #※ Preedit text (highlight)
    preedit_back_color: 0x24270E #0e2724            #※ Preedit background
    # hilited_back_color: 0xF099BBD3 #F0D3BB99         #※ Preedit background (highlight) => Transparentcy

    #※ Paging
    #※ Paging [Background]
    back_color:  0x24270E #0e2724                 #※ Paging background
    hilited_candidate_back_color: 0x394013 #134039   #※ Paging background (highlight)
    #※ Paging [output]
    candidate_text_color: 0x71B0C9 #c9b071          #※ Paging > ouput text (no highlight)
    hilited_candidate_text_color:  0x87DFFA #fadf87   #※ Paging > ouput text (highlight)
    #※ Paging [lable]
    label_color: 0x71B0C9 #c9b071                   #※ Paging > Label text (no highlight)
    hilited_candidate_label_color: 0x71B0C9 #c9b071  #※ Paging > Label text (highlight)
    #※ Paging [comment]
    comment_text_color: 0x71B0C9 #c9b071             #※ Paging > Comment text (no highlight)
    hilited_comment_text_color: 0x87DFFA #fadf87      #※ Paging > Comment text (highlight)


